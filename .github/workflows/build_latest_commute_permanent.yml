name: Build latest 출퇴근길 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-latest:
    runs-on: ubuntu-latest
    env:
      SEOUL_SUBWAY_KEY: ${{ secrets.SEOUL_SUBWAY_KEY }}
      SEOUL_BUS_KEY: ${{ secrets.SEOUL_BUS_KEY }}

    steps:
      - name: Verify API secrets
        shell: bash
        run: |
          test -n "$SEOUL_SUBWAY_KEY" || { echo "::error::SEOUL_SUBWAY_KEY missing"; exit 1; }
          test -n "$SEOUL_BUS_KEY" || { echo "::error::SEOUL_BUS_KEY missing"; exit 1; }

      - name: Find latest Release ZIP
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/latest",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "CommuteBoard-Actions",
              },
          )
          with urllib.request.urlopen(req) as r:
              rel = json.load(r)

          # First preference: real release .zip asset
          candidates = []
          for a in rel.get("assets", []):
              name = a.get("name", "")
              if name.lower().endswith(".zip") and "commuteboard" in name.lower():
                  candidates.append(a.get("browser_download_url"))

          # Mobile GitHub often inserts uploaded ZIP as a user-attachments link in release body.
          body = rel.get("body") or ""
          body_urls = re.findall(
              r'https://github\.com/user-attachments/files/\d+/[^\s\)]+\.zip',
              body,
              flags=re.I,
          )
          candidates.extend(body_urls)

          candidates = [x for x in candidates if x]
          if not candidates:
              raise SystemExit(
                  "ERROR: Latest Release has no CommuteBoard ZIP. "
                  "Upload one CommuteBoard*.zip file to the newest Release."
              )

          url = candidates[-1]
          print("Latest release:", rel.get("tag_name"))
          print("Project ZIP:", url)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"zip_url={url}\n")
              f.write(f"tag={rel.get('tag_name','latest')}\n")
          PY

      - name: Download latest project
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve("${{ steps.latest.outputs.zip_url }}", "CommuteBoard.zip")
          PY

      - name: Extract project
        shell: bash
        run: |
          rm -rf _commute_src
          mkdir -p _commute_src
          unzip -q CommuteBoard.zip -d _commute_src
          ROOT="$(find _commute_src -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "::error::Android project root not found in ZIP"
            find _commute_src -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Locate APK
        shell: bash
        run: |
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::APK not found after build"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/출퇴근길-debug.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 출퇴근길-APK-${{ steps.latest.outputs.tag }}
          path: dist/출퇴근길-debug.apk
          if-no-files-found: error
          retention-days: 30
