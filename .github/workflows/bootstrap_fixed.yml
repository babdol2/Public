name: Bootstrap & Build 출퇴근길 APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CommuteBoard project ZIP
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://github.com/user-attachments/files/31516701/CommuteBoard_GitHub_Actions_v2_TimetableFix-1.zip"
          urllib.request.urlretrieve(url, "CommuteBoard.zip")
          PY

      - name: Extract project
        run: |
          rm -rf _commute_tmp
          mkdir -p _commute_tmp
          unzip -q CommuteBoard.zip -d _commute_tmp

          ROOT="$(find _commute_tmp -maxdepth 3 -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle not found in ZIP"
            find _commute_tmp -maxdepth 3 -type f | sort
            exit 1
          fi

          cp -a "$ROOT"/. .
          rm -rf _commute_tmp CommuteBoard.zip

      - name: Inject API keys from GitHub Secrets
        run: |
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/api_keys.properties <<EOF
          SEOUL_SUBWAY_KEY=${{ secrets.SEOUL_SUBWAY_KEY }}
          SEOUL_BUS_KEY=${{ secrets.SEOUL_BUS_KEY }}
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Rename APK
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi
          cp "$APK" "출퇴근길-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 출퇴근길-APK
          path: 출퇴근길-debug.apk
          if-no-files-found: error
